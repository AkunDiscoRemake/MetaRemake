plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.metaremake.vr'
    compileSdk 34

    defaultConfig {
        applicationId "com.metaremake.vr"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // The JS runtime is embedded as a raw asset; keep it accessible at runtime.
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // MediaPipe Tasks Vision — Hand Landmarker used by the hand-tracking layer.
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}

// ---------------------------------------------------------------------------
// MediaPipe Hand Landmarker model.
//
// The model must live at app/src/main/assets/ml/hand_landmarker.task with the
// ".task" extension (NOT ".txt"). If a ".txt" copy of the model is present
// (for example because a host renamed the extension to pass an upload filter),
// this task renames it back to ".task" automatically, then verifies it.
// ---------------------------------------------------------------------------
def handModel = file('src/main/assets/ml/hand_landmarker.task')
def handModelTxt = file('src/main/assets/ml/hand_landmarker.txt')
def handModelTxt2 = file('src/main/assets/ml/hand_landmarker.task.txt')

tasks.register('downloadHandLandmarker') {
    group = 'metaremake'
    description = 'Download (or repair) the MediaPipe Hand Landmarker .task model.'
    doLast {
        def dir = file('src/main/assets/ml')
        dir.mkdirs()

        // 1) If a ".txt"-named copy exists, rename it to ".task".
        [handModelTxt, handModelTxt2].each { candidate ->
            if (candidate.exists()) {
                println "Renaming model file: ${candidate.name} -> ${handModel.name}"
                if (handModel.exists()) handModel.delete()
                candidate.renameTo(handModel)
            }
        }

        // 2) Download if still missing (with a few retries for CI robustness).
        if (!handModel.exists()) {
            def url = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
            println "Downloading Hand Landmarker model from ${url}"
            def attempts = 3
            def ok = false
            for (int attempt = 1; attempt <= attempts && !ok; attempt++) {
                try {
                    def conn = new URL(url).openConnection()
                    conn.setConnectTimeout(30000)
                    conn.setReadTimeout(180000)
                    conn.inputStream.withStream { input ->
                        handModel.withOutputStream { output -> output << input }
                    }
                    ok = handModel.length() > 0
                    if (!ok) { handModel.delete() }
                } catch (Throwable t) {
                    println "Download attempt ${attempt}/${attempts} failed: ${t.message}"
                    handModel.delete()
                    if (attempt < attempts) Thread.sleep(5000)
                }
            }
            if (!ok) {
                throw new GradleException("Could not download hand_landmarker.task after ${attempts} attempts. " +
                        "Drop the official model into assets/ml/hand_landmarker.task and retry.")
            }
            println "Saved ${handModel.absolutePath}"
        }

        if (handModel.length() < 1024 * 1024) {
            throw new GradleException("hand_landmarker.task looks invalid (${handModel.length()} bytes). " +
                    "Remove it and re-run downloadHandLandmarker, or drop the official model into assets/ml/.")
        }
        println "Hand Landmarker model OK: ${handModel.length()} bytes"
    }
}

// Make sure the model is present before assembling the app.
tasks.whenTaskAdded { task ->
    if (task.name == 'preDebugBuild' || task.name == 'preReleaseBuild') {
        task.dependsOn 'downloadHandLandmarker'
    }
}
