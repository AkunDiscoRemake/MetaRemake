name: Build Zentra XR APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest" 2>/dev/null || true
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.9/bin/gradle /usr/local/bin/gradle
          gradle --version | head -5

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Assemble Debug + Release
        id: assemble
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Publish build log and APKs to the build-out branch
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/build-out
          cp gradle-build.log /tmp/build-out/ 2>/dev/null || true
          mkdir -p /tmp/build-out/apk
          cp app/build/outputs/apk/debug/*.apk /tmp/build-out/apk/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk /tmp/build-out/apk/ 2>/dev/null || true
          ls -la /tmp/build-out /tmp/build-out/apk > /tmp/build-out/listing.txt 2>&1 || true
          cd /tmp/build-out
          git init -q
          git checkout -q -b build-out
          git add -A
          git -c user.name="ci" -c user.email="ci@github.com" commit -q -m "build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" || echo "nothing to commit"
          git push -q --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git build-out

      - name: Fail on compile error
        if: steps.assemble.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZentraXR-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZentraXR-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Zentra XR ${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk
