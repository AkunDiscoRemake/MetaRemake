name: LuaJITMR CI

on:
  push:
    branches:
      - arena/01a0a7e7-metaremake
      - main
    paths-ignore:
      - 'Documentation~/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PACKAGE_DIR: com.aham.luajitmr

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON
        run: |
          set -e
          for f in \
            "${PACKAGE_DIR}/package.json" \
            "${PACKAGE_DIR}/Runtime/LuaJITMR.Runtime.asmdef" \
            "${PACKAGE_DIR}/Editor/LuaJITMR.Editor.asmdef" \
            "${PACKAGE_DIR}/Tests/LuaJITMR.Tests.asmdef"; do
            echo "validating $f"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('  OK');" "$f"
          done
      - name: Check required files
        run: |
          set -e
          for f in \
            "Runtime/Core/LuaJITMR.cs" \
            "Runtime/Core/LuaJITMRSettings.cs" \
            "Runtime/Core/LuaJITMRPlayer.cs" \
            "Plugins/WebGL/luajitmr_webxr.jslib" \
            "Plugins/Android/AndroidManifest.xml" \
            "Editor/Settings/LuaJITMRSettingsProvider.cs" \
            "Editor/Build/AndroidBuildValidator.cs" \
            "Editor/Build/WebGLBuildValidator.cs" \
            "Editor/Wizard/SetupWizard.cs" \
            "Samples~/06_GorillaTag/Scripts/GorillaPlayer.cs" \
            "Samples~/07_BeatSaber/Scripts/BeatSaberGame.cs"; do
            P="${PACKAGE_DIR}/$f"
            if [ -f "$P" ]; then echo "  OK  $f"; else echo "  MISS $f"; exit 1; fi
          done
      - name: Read version
        id: ver
        run: |
          V=$(node -p "require('./${PACKAGE_DIR}/package.json').version")
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${V}" >> "$GITHUB_ENV"
          echo "Version: ${V}"

  pack:
    name: Pack package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pack tgz + tar.gz
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist
          cd "${PACKAGE_DIR}"
          TGZ=$(npm pack --pack-destination .. 2>&1 | grep -E '\.tgz$' | tail -n1 | tr -d '\r\n')
          cd ..
          cp "${TGZ}" dist/
          V=$(node -p "require('./${PACKAGE_DIR}/package.json').version")
          TGZ_BN=$(basename "${TGZ}")
          TARGZ="com.aham.luajitmr-${V}.tar.gz"
          tar -czf "dist/${TARGZ}" -C "${PACKAGE_DIR}" Runtime Editor Plugins package.json
          ls -la dist/
          echo "tgz=${TGZ_BN}" >> "$GITHUB_OUTPUT"
          echo "tar=${TARGZ}" >> "$GITHUB_OUTPUT"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: LuaJITMR-${{ steps.pack.outputs.version }}
          path: dist/*
          retention-days: 90

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [pack, validate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0a7e7-metaremake' && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LuaJITMR-${{ needs.pack.outputs.version }}
          path: release-files/
      - name: Check if tag exists, delete if so
        run: |
          VER="${{ needs.pack.outputs.version }}"
          git tag -d "v${VER}" 2>/dev/null || true
          git push origin ":v${VER}" 2>/dev/null || true
      - name: Build release notes
        run: |
          VER="${{ needs.pack.outputs.version }}"
          {
            echo "## LuaJITMR v${VER}"
            echo ""
            echo "### Download"
            echo "- Download the attached tgz/tar.gz and import into Package Manager."
            echo ""
            echo "### Git URL"
            echo "https://github.com/AkunDiscoRemake/MetaRemake.git?path=com.aham.luajitmr#v${VER}"
            echo ""
            echo "This release is a prerelease. See Documentation~/CHANGELOG.md."
          } > RELEASE_NOTES.md
          ls -la release-files/ || echo "(no release-files, continuing)"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.pack.outputs.version }}
          name: LuaJITMR v${{ needs.pack.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release-files/*
          prerelease: true
          target_commitish: arena/01a0a7e7-metaremake
