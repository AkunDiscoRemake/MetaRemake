name: Build Android (MetaRemake)

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a081ff-metaremake']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (captura log)
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug > build-log.txt 2>&1
          echo $? > build-exit.txt
          echo "===== tail do log ====="
          tail -n 200 build-log.txt

      - name: List APKs
        if: always()
        run: |
          find . -name '*.apk' -not -path './.gradle/*' -print 2>/dev/null || true

      - name: Publicar log no repositório (apenas em falha)
        if: always()
        run: |
          code="$(cat build-exit.txt 2>/dev/null || echo 1)"
          if [ "$code" != "0" ]; then
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add build-log.txt build-exit.txt
            git commit -m "ci: build log [skip ci]" || echo "nada a commitar"
            git push origin HEAD:arena/01a081ff-metaremake || echo "push falhou"
          fi

      - name: Falhar se o build falhou
        if: always()
        run: |
          code="$(cat build-exit.txt 2>/dev/null || echo 1)"
          if [ "$code" != "0" ]; then
            echo "Build falhou com exit $code"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MetaRemake-APK-debug
          path: '**/*.apk'
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar APK como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "APK nao encontrado"; exit 1; fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          gh release delete v0.1.0 -y --cleanup-tag 2>/dev/null || true
          gh release create v0.1.0 "$APK" \
            --title "MetaRemake v0.1.0 - Cardboard VR (debug)" \
            --notes "Build automatizado do GitHub Actions (branch arena/01a081ff-metaremake). Instale em um celular Android 8.0+ e use com um headset Google Cardboard (landscape). Conceda as permissoes solicitadas: camera (MR / hand tracking), captura de tela (apps Android dentro do VR) e acessibilidade (interacao com os apps)."

